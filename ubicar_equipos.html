<title>Ubicar equipos en el plano — SCV-PTBG</title>
<style>
  :root {
    --fondo: #12161c; --panel: #1b212a; --borde: #2c3542;
    --texto: #e6edf5; --tenue: #8b98a8;
    --acento: #f5a623; --puesto: #3ddc84; --sistema: #5aa9e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--fondo); color: var(--texto);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden;
  }
  #lateral {
    width: 340px; flex: none; background: var(--panel);
    display: flex; flex-direction: column; border-right: 1px solid var(--borde);
  }
  #cabecera { padding: 16px 16px 12px; border-bottom: 1px solid var(--borde); }
  #titulo { font-size: 20px; font-weight: 700; color: var(--acento); }
  #detalle { color: var(--tenue); font-size: 12px; margin-top: 4px;
             white-space: pre-line; }
  #progreso { margin-top: 10px; font-size: 12px; font-weight: 600; }
  #barra { height: 4px; background: var(--borde); border-radius: 2px;
           margin-top: 6px; overflow: hidden; }
  #barra > div { height: 100%; width: 0; background: var(--puesto);
                 transition: width .2s; }
  #lista { flex: 1; overflow-y: auto; padding: 8px 0;
           font-family: Consolas, ui-monospace, monospace; font-size: 12px; }
  .sis { color: var(--sistema); padding: 10px 16px 4px; font-weight: 700;
         letter-spacing: .04em; }
  .eq { padding: 3px 16px 3px 28px; color: var(--tenue); cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq:hover { background: #232b36; }
  .eq.puesto { color: var(--puesto); }
  .eq.activo { color: var(--acento); background: #2a3240; font-weight: 700; }
  #ayuda { padding: 10px 16px; color: var(--tenue); font-size: 11px;
           border-top: 1px solid var(--borde);
           font-family: Consolas, ui-monospace, monospace; white-space: pre; }
  #acciones { padding: 12px 16px 16px; display: grid; gap: 8px; }
  button { border: 0; border-radius: 6px; padding: 10px; cursor: pointer;
           font: 600 13px "Segoe UI", sans-serif; }
  #guardar { background: var(--puesto); color: #0d1117; }
  #cargar, #limpiar { background: transparent; color: var(--tenue);
                      border: 1px solid var(--borde); }
  #cargar:hover, #limpiar:hover { color: var(--texto); }
  #lienzo { flex: 1; display: block; cursor: crosshair; }
  #pie { position: fixed; left: 356px; bottom: 12px; color: var(--tenue);
         font: 12px Consolas, monospace; pointer-events: none;
         text-shadow: 0 0 6px #000; }
  #aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           background: var(--puesto); color: #0d1117; padding: 10px 18px;
           border-radius: 6px; font-weight: 600; opacity: 0;
           transition: opacity .25s; pointer-events: none; }
  #aviso.ver { opacity: 1; }
</style>
</head>
<body>
<div id="lateral">
  <div id="cabecera">
    <div id="titulo"></div>

    <div id="barra"><div></div></div>

  <div id="lista"></div>

Supr ............. quitar el punto
0 ................ ver todo</div>

  # ── CENTRIFUGADORAS ─────────────────────────────────────\n\u0001: (None, None),      # 12-05-DO-EM101-S     · 12-05-DO-EM101-S   · TRATAMIENTO DE COMBUSTIBLE\n\u0001: (None, None),      # 12-05-DO-EM101-D     · 12-05-DO-EM101-D   · TRATAMIENTO DE COMBUSTIBLE\n\u0001: (None, None),      # 12-05-DO-EM201       · 12-05-DO-EM201     · TRATAMIENTO DE COMBUSTIBLE\n\u0001: (None, None),      # 17-06-DO_EM101_S     · 17-06-DO_EM101_S   · TRATAMIENTO DE COMBUSTIBLE\n\u0001: (None, None),      # 17-06-DO_EM101_D     · 17-06-DO_EM101_D   · TRATAMIENTO DE COMBUSTIBLE\n\u0001: (None, None),      # 17-06-DO_EM201       · 17-06-DO_EM201     · TRATAMIENTO DE COMBUSTIBLE\n\n    # ── SKID DE PRUEBA ──────────────────────────────────────\n\u0001: (None, None),          # B_NOX                · B_NOX              · SKID DE PRUEBA\n\u0001: (None, None),          # VENT                 · VENT               · SKID DE PRUEBA\n\n    # ── AGUA POTABLE ────────────────────────────────────────\n\u0001: (None, None),      # 10PW-01A             · 10-PW-CP-001A      · AGUA DE SERVICIO\n\u0001: (None, None),      # 10PW-01B             · 10-PW-CP-001B      · AGUA DE SERVICIO\n\u0001: (None, None),      # 10RW-02A             · 10-RW-CP-002A      · AGUA CRUDA\n\u0001: (None, None),      # 10RW-02B             · 10-RW-CP-002B      · AGUA CRUDA\n\n    # ── AIRE COMPRIMIDO ─────────────────────────────────────\n\u0001: (None, None),      # COMPRESOR A          · 10-IA-CPR-001A     · SISTEMA DE AIRE INSTRUMENTOS\n\u0001: (None, None),      # COMPRESOR B          · 10-IA-CPR-001B     · SISTEMA DE AIRE INSTRUMENTOS\n\u0001: (None, None),      # COMPRESOR C          · 10-SA-CPR-001      · SISTEMA DE AIRE DE USO GENERAL\n}\n\n\n# El black start no esta en la lista de arriba porque no tiene LOCALIZACION:\n# es uno solo en la planta y su registro no cuelga de ningun equipo.\nBLACK_START = (None, None)\n\n\n# ── Zonas del plano (opcional) ───────────────────────────────────────────────\n#\n# Rotulos de a 40, 0.830, 0.340),\n    \"TANQUES AGUA ACEITOSA\":   (0.893, 0.290, 0.968, 0.385),\n    \"LAGUNA DE EVAPORACION\":   (0.830, 0.020, 1.000, 0.150),\n}\n\n\ndef sin_ubicar():\n    \"\"\"Los equipos que todavia no tienen punto en el plano.\"\"\"\n    return [loc for loc, punto in EQUIPOS.items() if punto[0] is None]\n\n\ndef validar():\n    \"\"\"Revisa que lo colocado tenga sentido. Devuelve la lista de problemas.\"\"\"\n    problemas = []\n    for loc, (x, y) in EQUIPOS.items():\n        if x is None or y is None:\n            continue\n        if not (0.0 <= x <= 1.0 and 0.0 <= y <= 1.0):\n            problemas.append(f\"LOC-{loc}: ({x}, {y}) esta fuera del plano\")\n    # Dos equipos en el mismo punto suelen ser un copiar y pegar sin corregir.\n    vistos = {}\n    for loc, punto in EQUIPOS.items():\n        if punto[0] is None:\n            continue\n        clave = (round(punto[0], 4), round(punto[1], 4))\n        if clave in vistos:\n            problemas.append(\n                f\"LOC-{loc} esta exactamente encima de LOC-{vistos[clave]}\"\n            )\n        vistos[clave] = loc\n    return problemas\n\n\nif __name__ == \"__main__\":\n    faltan = sin_ubicar()\n    print(f\"Equipos en el mapa: {len(EQUIPOS) - len(faltan)} de {len(EQUIPOS)}\")\n    if faltan:\n        print(\"Sin ubicar:\", \", \".join(f\"LOC-{n}\" for n in faltan))\n    for problema in validar():\n        print(\"  OJO:\", problema)\n";
const CLAVE = "scv-ptbg-mapa";

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
const plano = new Image();

let escala = 1, ox = 0, oy = 0, indice = 0;
const historial = [];

// Se recuerda en el navegador para poder cerrar a medias y seguir despues,
// igual que la version de escritorio.
try {
  const guardado = JSON.parse(localStorage.getItem(CLAVE) || "{}");
  EQUIPOS.forEach(e => {
    if (guardado[e.loc]) { e.x = guardado[e.loc][0]; e.y = guardado[e.loc][1]; }
  });
} catch (err) { /* si el almacenamiento falla se sigue sin el */ }

const puesto = e => e.x !== null && e.x !== undefined;
const actual = () => EQUIPOS[indice];

function persistir() {
  const datos = {};
  EQUIPOS.forEach(e => { if (puesto(e)) datos[e.loc] = [e.x, e.y]; });
  try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch (err) {}
}

// ── Lista ──────────────────────────────────────────────────────────────────
function pintarLista() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  let sistema = null;
  EQUIPOS.forEach((e, i) => {
    if (e.sistema !== sistema) {
      sistema = e.sistema;
      const h = document.createElement("div");
      h.className = "sis"; h.textContent = sistema;
      lista.appendChild(h);
    }
    const fila = document.createElement("div");
    fila.className = "eq" + (puesto(e) ? " puesto" : "") +
                     (i === indice ? " activo" : "");
    fila.textContent = (puesto(e) ? "+ " : "\u00b7 ") + e.nombre;
    fila.onclick = () => { indice = i; pintarTodo(); };
    lista.appendChild(fila);
  });
  const activo = lista.querySelector(".activo");
  if (activo) activo.scrollIntoView({ block: "nearest" });

  const e = actual();
  document.getElementById("titulo").textContent =
    e.nombre + (e.unidad ? "   " + e.unidad : "");
  document.getElementById("detalle").textContent =
    (e.loc >= 0 ? "LOC-" + e.loc + "   \u00b7   " : "") + e.tag +
    "\n" + e.sistema + "\n" + e.subsistema;
  const n = EQUIPOS.filter(puesto).length;
  document.getElementById("progreso").textContent =
    n + " de " + EQUIPOS.length + " colocados";
  document.querySelector("#barra > div").style.width =
    (100 * n / EQUIPOS.length) + "%";
}

// ── Mapa ───────────────────────────────────────────────────────────────────
function encajar() {
  escala = Math.min(lienzo.width / plano.width, lienzo.height / plano.height);
  ox = (plano.width - lienzo.width / escala) / 2;
  oy = (plano.height - lienzo.height / escala) / 2;
}

const aPantalla = (x, y) => [(x - ox) * escala, (y - oy) * escala];
const aImagen = (cx, cy) => [ox + cx / escala, oy + cy / escala];

function pintarMapa() {
  ctx.fillStyle = "#12161c";
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  ctx.imageSmoothingEnabled = escala < 1;
  const [px, py] = aPantalla(0, 0);
  ctx.drawImage(plano, px, py, plano.width * escala, plano.height * escala);

  // Los rotulos ya escritos, para que los siguientes no se les encimen.
  const rotulos = [];
  const cabe = (x, y, ancho) => {
    const caja = [x, y - 7, x + ancho, y + 7];
    for (const o of rotulos) {
      if (caja[0] < o[2] && caja[2] > o[0] &&
          caja[1] < o[3] && caja[3] > o[1]) return false;
    }
    rotulos.push(caja);
    return true;
  };

  // El marcador activo se dibuja de ultimo, para que quede por encima de los
  // demas. Pero su ROTULO se reserva antes que ninguno: es el equipo que se
  // esta colocando y su nombre no puede ser el que se calle. Dibujando en el
  // mismo orden en que se reserva, el vecino le robaba el sitio.
  ctx.font = "bold 11px Segoe UI, sans-serif";
  const activoE = EQUIPOS[indice];
  if (puesto(activoE)) {
    const [ax, ay] = aPantalla(activoE.x * plano.width,
                               activoE.y * plano.height);
    const t = activoE.nombre + (activoE.unidad ? " " + activoE.unidad : "");
    rotulos.push([ax + 17, ay - 7,
                  ax + 17 + ctx.measureText(t).width, ay + 7]);
  }

  const orden = EQUIPOS.map((e, i) => i)
                       .sort((a, b) => (a === indice ? 1 : 0) -
                                       (b === indice ? 1 : 0));
  orden.forEach(i => {
    const e = EQUIPOS[i];
    if (!puesto(e)) return;
    const [cx, cy] = aPantalla(e.x * plano.width, e.y * plano.height);
    if (cx < -40 || cy < -40 || cx > lienzo.width + 40 ||
        cy > lienzo.height + 40) return;
    const activo = i === indice;
    // Los marcadores son deliberadamente chicos: el punto tiene que caer
    // sobre el equipo exacto, y una bola grande tapa justo lo que hay que
    // mirar para acertar. Se dibujan en pixeles de pantalla, asi que al
    // acercarse el marcador no crece y la punteria mejora con el zoom.
    const r = activo ? 5 : 3.5;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
    ctx.fillStyle = activo ? "#f5a623" : "#3ddc84";
    ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#0d1117"; ctx.stroke();
    if (activo) {
      // Al que se esta colocando se le cruzan dos rayas finas para ver el
      // centro exacto sin que el propio marcador lo tape.
      ctx.strokeStyle = "#f5a623"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 14, cy); ctx.lineTo(cx - r - 2, cy);
      ctx.moveTo(cx + r + 2, cy); ctx.lineTo(cx + 14, cy);
      ctx.moveTo(cx, cy - 14); ctx.lineTo(cx, cy - r - 2);
      ctx.moveTo(cx, cy + r + 2); ctx.lineTo(cx, cy + 14);
      ctx.stroke();
    }
    if (activo || escala > 1.2) {
      ctx.font = "bold 11px Segoe UI, sans-serif";
      ctx.textBaseline = "middle";
      const texto = e.nombre + (e.unidad ? " " + e.unidad : "");
      const ancho = ctx.measureText(texto).width;
      // Donde los equipos estan pegados —los tres compresores, las seis
      // centrifugadoras— los rotulos se montaban unos sobre otros y no se
      // leia ninguno. Justo donde mas falta hace distinguirlos. El que no
      // entra se calla; el marcador igual se ve, y la lista dice cual es.
      // El activo ya tiene su sitio reservado arriba; se dibuja sin preguntar.
      if (activo || cabe(cx + 17, cy, ancho)) {
        ctx.fillStyle = activo ? "#f5a623" : "#3ddc84";
        ctx.fillText(texto, cx + 17, cy);
      }
    }
  });
  document.getElementById("pie").textContent =
    "zoom " + escala.toFixed(2) + "x   \u00b7   " + actual().nombre +
    (actual().unidad ? " " + actual().unidad : "");
}

const pintarTodo = () => { pintarLista(); pintarMapa(); };

// ── Interaccion ────────────────────────────────────────────────────────────
function siguienteLibre() {
  for (let s = 1; s <= EQUIPOS.length; s++) {
    const i = (indice + s) % EQUIPOS.length;
    if (!puesto(EQUIPOS[i])) return i;
  }
  return null;
}

let arrastrando = null, movido = false, moviendo = null;
let ultimo = null, ignorar = false;

// Mayor que el marcador a proposito: el punto se dibuja chico para ver bien
// donde cae, pero agarrarlo con el raton necesita algo mas de margen.
const RADIO_AGARRE = 10;

// Que marcador esta bajo el cursor, o -1. Se busca de atras hacia adelante
// para que, si dos quedaron encimados, se agarre el que se ve por encima.
function marcadorEn(cx, cy) {
  for (let i = EQUIPOS.length - 1; i >= 0; i--) {
    const e = EQUIPOS[i];
    if (!puesto(e)) continue;
    const [mx, my] = aPantalla(e.x * plano.width, e.y * plano.height);
    if (Math.hypot(mx - cx, my - cy) <= RADIO_AGARRE) return i;
  }
  return -1;
}

const enLienzo = ev => {
  const r = lienzo.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
};

function fijar(e, x, y) {
  e.x = Math.round(x / plano.width * 1e4) / 1e4;
  e.y = Math.round(y / plano.height * 1e4) / 1e4;
}

lienzo.onmousedown = ev => {
  const [cx, cy] = enLienzo(ev);

  // Un segundo apretón en el mismo punto y en un suspiro no es una accion
  // nueva: es un doble clic o el rebote del contacto del raton. Se descarta
  // el gesto COMPLETO, no solo la colocacion.
  //
  // Descartar solo la colocacion no alcanzaba, y fallaba de la peor manera:
  // el clic repetido caia justo encima del marcador recien puesto, lo agarraba
  // y devolvia la seleccion a ese equipo. El siguiente clic —ya intencional—
  // no colocaba el equipo que tocaba, sino que mudaba el anterior a otro sitio.
  // Sin aviso y sin que el contador cambiara.
  if (ultimo && Date.now() - ultimo.t < 400 &&
      Math.hypot(cx - ultimo.x, cy - ultimo.y) < 14) {
    ignorar = true;
    return;
  }
  ignorar = false;

  const golpe = marcadorEn(cx, cy);
  if (golpe >= 0) {
    // Agarrar uno ya colocado para corregirlo de sitio, en vez de tener que
    // borrarlo y volver a ponerlo.
    const e = EQUIPOS[golpe];
    indice = golpe;
    moviendo = { i: golpe, x: e.x, y: e.y };
    lienzo.style.cursor = "grabbing";
    pintarTodo();
    return;
  }
  arrastrando = { x: ev.clientX, y: ev.clientY, ox, oy };
  movido = false;
};

window.onmousemove = ev => {
  if (ignorar) return;
  if (moviendo) {
    const [cx, cy] = enLienzo(ev);
    const [x, y] = aImagen(cx, cy);
    fijar(EQUIPOS[moviendo.i],
          Math.max(0, Math.min(plano.width, x)),
          Math.max(0, Math.min(plano.height, y)));
    pintarMapa();
    return;
  }
  if (arrastrando) {
    const dx = ev.clientX - arrastrando.x, dy = ev.clientY - arrastrando.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) movido = true;
    ox = arrastrando.ox - dx / escala;
    oy = arrastrando.oy - dy / escala;
    pintarMapa();
    return;
  }
  // Sin arrastre, el cursor avisa que hay un marcador debajo.
  if (ev.target === lienzo) {
    const [cx, cy] = enLienzo(ev);
    lienzo.style.cursor = marcadorEn(cx, cy) >= 0 ? "grab" : "crosshair";
  }
};

window.onmouseup = ev => {
  if (ignorar) { ignorar = false; return; }
  if (moviendo) {
    const e = EQUIPOS[moviendo.i];
    // El deshacer guarda donde estaba antes de agarrarlo, no cada pixel del
    // recorrido: un Ctrl+Z devuelve el marcador a su sitio de una vez.
    historial.push({ loc: e.loc, x: moviendo.x, y: moviendo.y });
    moviendo = null;
    lienzo.style.cursor = "crosshair";
    persistir();
    pintarTodo();
    return;
  }
  const iba = arrastrando; arrastrando = null;
  // Arrastrar mueve el plano; un clic limpio coloca. Sin este umbral, cada
  // intento de encuadrar dejaba un marcador suelto donde no iba.
  if (!iba || movido || ev.target !== lienzo) return;
  const [cx, cy] = enLienzo(ev);
  const [x, y] = aImagen(cx, cy);
  if (x < 0 || y < 0 || x > plano.width || y > plano.height) return;

  ultimo = { t: Date.now(), x: cx, y: cy };

  const e = actual();
  historial.push({ loc: e.loc, x: e.x, y: e.y });
  fijar(e, x, y);
  persistir();
  const sig = siguienteLibre();
  if (sig !== null) indice = sig;
  pintarTodo();
};

// Un doble clic del sistema no debe llegar como dos colocaciones.
lienzo.ondblclick = ev => ev.preventDefault();

lienzo.onwheel = ev => {
  ev.preventDefault();
  const r = lienzo.getBoundingClientRect();
  const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  const antes = escala;
  escala = Math.max(0.05, Math.min(12, escala * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
  // El punto bajo el cursor se queda quieto: el zoom sigue al raton.
  ox = ox + cx / antes - cx / escala;
  oy = oy + cy / antes - cy / escala;
  pintarMapa();
};

window.onkeydown = ev => {
  if (ev.ctrlKey && ev.key === "z") {
    const paso = historial.pop();
    if (!paso) return;
    const e = EQUIPOS.find(q => q.loc === paso.loc);
    e.x = paso.x; e.y = paso.y;
    indice = EQUIPOS.indexOf(e);
    persistir(); pintarTodo();
  } else if (ev.key === "Delete") {
    const e = actual();
    if (!puesto(e)) return;
    historial.push({ loc: e.loc, x: e.x, y: e.y });
    e.x = null; e.y = null;
    persistir(); pintarTodo();
  } else if (ev.key === "0") {
    encajar(); pintarMapa();
  } else if (ev.key === "ArrowDown" || ev.key === "ArrowRight") {
    indice = Math.min(indice + 1, EQUIPOS.length - 1); pintarTodo();
  } else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") {
    indice = Math.max(indice - 1, 0); pintarTodo();
  }
};

// ── Guardar ────────────────────────────────────────────────────────────────
function avisar(texto) {
  const a = document.getElementById("aviso");
  a.textContent = texto; a.classList.add("ver");
  setTimeout(() => a.classList.remove("ver"), 2600);
}

document.getElementById("guardar").onclick = () => {
  let salida = PLANTILLA;
  EQUIPOS.forEach(e => {
    const valor = puesto(e)
      ? "(" + e.x.toFixed(4) + ", " + e.y.toFixed(4) + ")"
      : "(None, None)";
    if (e.loc === -1) {
      salida = salida.replace(/BLACK_START = \([^)]*\)/, "BLACK_START = " + valor);
    } else {
      // La sangria se rehace desde cero. Reutilizar la que ya estaba en el
      // archivo corria la linea dos espacios en cada guardado, porque esa
      // sangria ya incluye el relleno que alinea los numeros.
      // Se rehace la linea entera, comentario incluido, con el mismo formato
      // que usa ubicar_equipos.py. Asi las dos herramientas producen archivos
      // identicos y se puede alternar entre una y otra sin que el archivo
      // aparezca modificado de punta a punta.
      const re = new RegExp("^\\s*" + e.loc + ": \\([^)]*\\),[ \\t]*(#.*)?$", "m");
      salida = salida.replace(re, (m, comentario) =>
        ("    " + String(e.loc).padStart(3) + ": " + valor + ",").padEnd(30) +
        (comentario ? "  " + comentario.trim() : ""));
    }
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([salida], { type: "text/plain" }));
  a.download = "mapa_planta.py";
  a.click();
  const n = EQUIPOS.filter(puesto).length;
  avisar("Descargado \u00b7 " + n + " de " + EQUIPOS.length + " colocados");
};

// Volver a cargar un mapa_planta.py ya empezado. El navegador recuerda lo
// colocado por su cuenta, pero eso se pierde si se cambia de equipo, si se
// borra el historial o si el navegador bloquea el almacenamiento. El archivo
// descargado es el respaldo de verdad, asi que tiene que poder volver a
// entrar. Sirve ademas para alternar con la herramienta de escritorio.
document.getElementById("cargar").onclick =
  () => document.getElementById("archivo").click();

document.getElementById("archivo").onchange = ev => {
  const archivo = ev.target.files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = () => {
    const texto = lector.result;
    let leidos = 0;
    EQUIPOS.forEach(e => {
      const re = e.loc === -1
        ? /BLACK_START\s*=\s*\(\s*([\d.]+)\s*,\s*([\d.]+)\s*\)/
        : new RegExp("^\\s*" + e.loc +
                     ":\\s*\\(\\s*([\\d.]+)\\s*,\\s*([\\d.]+)\\s*\\)", "m");
      const hallado = texto.match(re);
      if (hallado) {
        e.x = parseFloat(hallado[1]);
        e.y = parseFloat(hallado[2]);
        leidos++;
      }
    });
    historial.length = 0;
    const libre = EQUIPOS.findIndex(e => !puesto(e));
    indice = libre >= 0 ? libre : 0;
    persistir();
    pintarTodo();
    avisar(leidos + " equipos cargados del archivo");
  };
  lector.readAsText(archivo);
  ev.target.value = "";   // permite volver a cargar el mismo archivo
};

document.getElementById("limpiar").onclick = () => {
  if (!confirm("¿Borrar todos los puntos colocados?")) return;
  EQUIPOS.forEach(e => { e.x = null; e.y = null; });
  historial.length = 0;
  indice = 0;
  persistir(); pintarTodo();
};

// ── Arranque ───────────────────────────────────────────────────────────────
function medir() {
  lienzo.width = lienzo.clientWidth;
  lienzo.height = lienzo.clientHeight;
}

window.onresize = () => {
  medir();
  if (!escala) encajar();   // si aun no habia medida, esta es la buena
  pintarMapa();
};

// El plano va incrustado en el propio archivo, asi que termina de cargar
// antes de que el navegador haya calculado el tamano del lienzo. Arrancar en
// ese momento daba un ancho de cero, una escala de cero y un mapa en negro
// sin ningun error. Por eso se espera a que haya las dos cosas: imagen lista
// y lienzo con medidas de verdad.
function arrancar() {
  if (!plano.complete || !lienzo.clientWidth || !lienzo.clientHeight) {
    requestAnimationFrame(arrancar);
    return;
  }
  medir();
  encajar();
  const libre = EQUIPOS.findIndex(e => !puesto(e));
  indice = libre >= 0 ? libre : 0;
  pintarTodo();
}

plano.onload = arrancar;
plano.onerror = () => {
  document.getElementById("pie").textContent =
    "No se pudo cargar el plano incrustado.";
};
