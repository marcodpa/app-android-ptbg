name: scv_ptbg
description: STER - Sistema de Trazabilidad de Equipos Rotativos
version: 1.1.4+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Textos de Material (date/time pickers, tooltips) en espanol.
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  http: ^1.2.1
  mobile_scanner: ^5.1.1
  shared_preferences: ^2.2.3
  # Fijado por flutter_localizations: cada version del SDK exige la suya.
  intl: ^0.20.2
  uuid: ^4.4.0
  pdf: ^3.11.1
  printing: ^5.13.4
  # Se importa directo para dibujar el QR de la etiqueta de un equipo nuevo.
  # Ya venia con printing, pero se declara porque el codigo lo usa por su
  # cuenta y no debe depender de que printing siga trayendolo.
  barcode: ^2.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/filter_catalog.json
    - assets/images/
    - assets/images/point_refs/
    - assets/images/filters_flux/
